  <rect width="1200" height="260" rx="26" fill="#f5f3ec"/>
  <g font-family="Microsoft YaHei, PingFang SC, system-ui, sans-serif" font-size="56" font-weight="600" text-anchor="middle">
    <rect x="42" y="42" width="326" height="176" rx="22" fill="#e2ece1"/>
    <rect x="437" y="42" width="326" height="176" rx="22" fill="#176752"/>
    <rect x="832" y="42" width="326" height="176" rx="22" fill="#ece4f2"/>
    <text x="205" y="147" fill="#244438">① 放进来</text>
    <text x="600" y="147" fill="#fffef6">② 整理好</text>
