<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>魔法书屋知识图谱</title>
<style>
:root{color-scheme:dark;--bg:#171a20;--panel:#20242c;--line:#343c48;--text:#e4e9f1;--muted:#a2afbf;--green:#9cd8bb;--blue:#9cbbef;--orange:#e7ba86;--purple:#c9afe8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:#2b313d;border-radius:8px;padding:8px 12px}button:hover{background:#384256}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}header{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:17px 24px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0}header p{color:var(--muted);font-size:12px;margin:2px 0 0}.badge{color:#e9c79b;background:#493a2a;border-radius:9px;padding:5px 12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 90px)}.visual{position:relative;display:flex;flex-direction:column;min-width:0}.toolbar{padding:15px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-width:100%;width:225px}.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px}.toolbar label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.toolbar label input{width:auto}.canvas-wrap{height:calc(100vh - 245px);min-height:420px;position:relative;margin:0 12px;border-radius:14px;background:radial-gradient(ellipse at center,#212834 0%,#171a20 70%);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.empty{position:absolute;inset:0;display:none;place-content:center;text-align:center;color:var(--muted);pointer-events:none}.legend{display:flex;gap:19px;flex-wrap:wrap;padding:12px 22px;font-size:12px;color:var(--muted)}.legend span{display:flex;gap:7px;align-items:center}.legend i{width:9px;height:9px;border-radius:50%}.hint{padding:0 22px 16px;color:var(--muted);font-size:12px}.sidebar{background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow-wrap:anywhere}h2{font-size:17px;line-height:1.5;margin:0 0 10px}.meta{font-size:12px;color:var(--muted);margin:8px 0}.node-title{font-size:18px;color:var(--green)}a{color:var(--blue)}.counts{font-size:13px;color:var(--muted);margin:0 0 23px}.detail{padding:18px 0;border-top:1px solid var(--line)}.detail p{font-size:13px;white-space:pre-wrap}.node-list{display:grid;gap:6px;max-height:260px;overflow:auto;margin-top:12px}.node-list button{font-size:12px;text-align:left;background:transparent;padding:7px 9px}.node-list button[aria-pressed=true]{background:#3d4b5a}.edge{border-left:2px solid var(--line);padding:5px 0 5px 10px;font-size:12px;margin:10px 0}.edge small{display:block;color:var(--muted)}.notice{color:var(--orange);font-size:12px}.print-note{display:none}@media(max-width:760px){header{padding:14px 16px;align-items:flex-start}.layout{grid-template-columns:1fr}.sidebar{border-left:0;border-top:1px solid var(--line)}.canvas-wrap{height:55vh;min-height:370px}.toolbar{padding:12px}.toolbar input{width:180px}.badge{font-size:11px}.sidebar .node-list{max-height:180px}h1{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{body{background:white;color:black}header,.sidebar{color:black;background:white}.layout{display:block}.toolbar{display:none}.canvas-wrap{height:500px}.hint{display:none}.print-note{display:block}}
</style></head><body>
<header><div><h1 id="heading">知识关系图谱</h1><p>Magic Study · 魔法书屋 · 本地快照 · 连线可追溯到引用依据</p></div><span class="badge" id="badge">按需生成</span></header>
<div class="layout"><main class="visual"><div class="toolbar"><input id="search" type="search" placeholder="搜索标题、摘要或摘录" aria-label="搜索节点"><select id="kind" aria-label="筛选知识类型"><option value="">全部类型</option><option value="source">来源笔记</option><option value="topic">主题知识</option><option value="experience">实践经验</option><option value="document">其他文档</option><option value="index">导航</option><option value="log">记录</option></select><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="reset">重置视图</button><button id="motion">暂停布局</button><label><input id="neighbors" type="checkbox">只看选中节点及邻居</label></div><div class="canvas-wrap" id="canvas-wrap"><canvas id="graph" aria-label="知识关系网络；可用右侧节点列表选择文档。拖动节点，滚轮缩放，空白处拖动画布。"></canvas><div class="empty" id="empty">当前筛选下没有节点<br>清除搜索或更换类型</div></div><div class="legend"><span><i style="background:var(--green)"></i>主题</span><span><i style="background:var(--blue)"></i>来源</span><span><i style="background:var(--orange)"></i>实践</span><span><i style="background:var(--purple)"></i>其他</span></div><div class="hint">拖动节点 · 空白处平移 · 滚轮缩放 · 点击节点查看关联与原文<br>距离只用于排版，不表示观点相似或可信程度。</div></main><aside class="sidebar"><p class="counts" id="counts"></p><p class="notice" id="coverage"></p><div id="details" class="detail" aria-live="polite"><h2>从一个问题开始探索</h2><p>点击图中的节点或下方列表，查看它和其他知识的关系。</p></div><div class="detail"><h2>当前可见节点</h2><div class="node-list" id="node-list"></div></div><p class="meta">本文件包含标题、摘要与链接。分享前请确认其中没有私人资料。没有外部脚本或后台网络请求。</p></aside></div>
<script id="graph-data" type="application/json">__ELX_GRAPH_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('graph-data').textContent),canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),wrap=document.getElementById('canvas-wrap');
document.title=data.title+' · Magic Study · 魔法书屋';document.getElementById('heading').textContent=data.title;document.getElementById('badge').textContent=data.demo?'合成资料演示':'本地知识快照';
const kindNames={source:'来源笔记',topic:'主题知识',experience:'实践经验',document:'其他文档',index:'导航',log:'记录'},colors={source:'#9cbbef',topic:'#9cd8bb',experience:'#e7ba86',document:'#c9afe8',index:'#c9afe8',log:'#c9afe8'};
const nodes=data.nodes.map((d,i)=>({...d,x:Math.cos(i*2.39996)*Math.sqrt(i+1)*85,y:Math.sin(i*2.39996)*Math.sqrt(i+1)*85,vx:0,vy:0})),byId=new Map(nodes.map(n=>[n.id,n])),edges=data.edges.filter(e=>byId.has(e.source)&&byId.has(e.target));
const adj=new Map(nodes.map(n=>[n.id,new Set()]));edges.forEach(e=>{adj.get(e.source).add(e.target);adj.get(e.target).add(e.source)});
let visible=nodes,shownEdges=edges,selected=null,scale=1,pan={x:0,y:0},width=0,height=0,drag=null,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,steps=0,framePending=false,initialFit=false;
document.getElementById('coverage').textContent=(data.omitted?'本图省略 '+data.omitted+' 篇，请缩小范围查看。':'')+(data.unresolved.length?'有 '+data.unresolved.length+' 个引用未进入当前索引，不等于链接失效。':'');
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function detail(id){selected=id;const n=byId.get(id);if(!n)return;const box=document.getElementById('details');box.replaceChildren();const h=element('h2',n.title);h.className='node-title';box.append(h,element('small',n.summaryKind==='summary'?'摘要':n.summaryKind==='excerpt'?'正文摘录':'暂无说明'),element('p',n.summary||'没有合适的摘要或正文摘录；打开原文查看内容。'));if(n.summaryStale){const warning=element('p','摘要对应旧版本或未标版本，当前展示正文摘录；需要重新整理。');warning.className='notice';box.append(warning);}const meta=element('p',(kindNames[n.kind]||n.kind)+' · 获取：'+(n.fetchedAt||'未记录'));meta.className='meta';box.append(meta);if(n.url){try{const u=new URL(n.url);if(['https:','http:'].includes(u.protocol)&&!u.username&&!u.password){const a=element('a','打开原文 ↗');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';box.append(a);}}catch{}}
for(const e of edges.filter(e=>e.source===id||e.target===id)){const to=e.source===id?e.target:e.source;const p=element('div');p.className='edge';p.append(element('div',(e.source===id?'→ ':'← ')+byId.get(to).title+' · '+e.type),element('small',e.evidence));box.append(p)}filter();}
function filter(){const q=document.getElementById('search').value.toLocaleLowerCase(),kind=document.getElementById('kind').value,near=document.getElementById('neighbors').checked;visible=nodes.filter(n=>(!q||(n.title+' '+n.summary).toLocaleLowerCase().includes(q))&&(!kind||n.kind===kind)&&(!near||!selected||n.id===selected||adj.get(selected).has(n.id)));const ids=new Set(visible.map(n=>n.id));shownEdges=edges.filter(e=>ids.has(e.source)&&ids.has(e.target));document.getElementById('counts').textContent=visible.length+' / '+nodes.length+' 个节点 · '+shownEdges.length+' 条关系';document.getElementById('empty').style.display=visible.length?'none':'grid';const list=document.getElementById('node-list');list.replaceChildren();for(const n of visible){const b=element('button',n.title);b.setAttribute('aria-pressed',String(n.id===selected));b.onclick=()=>detail(n.id);list.append(b)}draw();}
function fit(){if(!nodes.length)return;const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);scale=Math.max(.2,Math.min(1.4,width/(maxX-minX+210),height/(maxY-minY+120)));pan={x:-(minX+maxX)/2*scale,y:-(minY+maxY)/2*scale}}
function resize(){const r=wrap.getBoundingClientRect();width=r.width;height=r.height;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);if(!initialFit){fit();initialFit=true}draw()}
function draw(){ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(width/2+pan.x,height/2+pan.y);ctx.scale(scale,scale);for(const e of shownEdges){const a=byId.get(e.source),b=byId.get(e.target),active=selected&&(e.source===selected||e.target===selected);ctx.beginPath();ctx.strokeStyle=active?'#b5c6dc':'#526278';ctx.globalAlpha=active?.9:.42;ctx.lineWidth=(active?1.8:1)/scale;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
ctx.globalAlpha=1;for(const n of visible){const active=n.id===selected,neighbor=selected&&adj.get(selected).has(n.id),radius=active?10:6+Math.min(adj.get(n.id).size,8)*.45;ctx.globalAlpha=!selected||active||neighbor?1:.42;ctx.beginPath();ctx.fillStyle=colors[n.kind]||colors.document;ctx.arc(n.x,n.y,radius,0,Math.PI*2);ctx.fill();if(active){ctx.strokeStyle='#eef4ff';ctx.lineWidth=2/scale;ctx.stroke()}if(visible.length<65||active||neighbor||scale>1.5){ctx.font=(12/Math.max(.75,scale))+'px system-ui';ctx.fillStyle='#e5ebf4';ctx.textAlign='center';const label=n.title.length>21?n.title.slice(0,20)+'…':n.title;ctx.fillText(label,n.x,n.y+radius+17/scale)}}ctx.restore();ctx.globalAlpha=1}
function layout(){framePending=false;if(paused||steps>450)return;for(let i=0;i<nodes.length;i++){const a=nodes[i];a.vx-=a.x*.0007;a.vy-=a.y*.0007;for(let j=i+1;j<nodes.length;j++){const b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.max(80,dx*dx+dy*dy),force=140/dist;a.vx+=dx*force;a.vy+=dy*force;b.vx-=dx*force;b.vy-=dy*force}}
for(const e of edges){const a=byId.get(e.source),b=byId.get(e.target),dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,force=(dist-115)*.008;a.vx+=dx/dist*force;a.vy+=dy/dist*force;b.vx-=dx/dist*force;b.vy-=dy/dist*force}for(const n of nodes){n.vx*=.8;n.vy*=.8;if(drag?.node!==n){n.x+=Math.max(-6,Math.min(6,n.vx));n.y+=Math.max(-6,Math.min(6,n.vy))}}steps++;draw();requestFrame()}
function requestFrame(){if(!framePending&&!paused&&steps<=450){framePending=true;requestAnimationFrame(layout)}}
function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-width/2-pan.x)/scale,y:(e.clientY-r.top-height/2-pan.y)/scale}}
function hit(p){return [...visible].reverse().find(n=>Math.hypot(n.x-p.x,n.y-p.y)<15/scale+5)}
canvas.addEventListener('pointerdown',e=>{const p=position(e);drag={node:hit(p),x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;if(drag.node){const p=position(e);drag.node.x=p.x;drag.node.y=p.y;drag.node.vx=drag.node.vy=0}else{pan.x+=e.clientX-drag.x;pan.y+=e.clientY-drag.y}drag.x=e.clientX;drag.y=e.clientY;draw()});
canvas.addEventListener('pointerup',e=>{if(drag?.node&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<6)detail(drag.node.id);drag=null});canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=position(e);scale=Math.max(.2,Math.min(4,scale*Math.exp(-e.deltaY*.001)));const r=canvas.getBoundingClientRect();pan.x=e.clientX-r.left-width/2-before.x*scale;pan.y=e.clientY-r.top-height/2-before.y*scale;draw()},{passive:false});
document.getElementById('search').oninput=filter;document.getElementById('kind').onchange=filter;document.getElementById('neighbors').onchange=filter;
document.getElementById('zoom-in').onclick=()=>{scale=Math.min(4,scale*1.25);draw()};document.getElementById('zoom-out').onclick=()=>{scale=Math.max(.2,scale/1.25);draw()};document.getElementById('reset').onclick=()=>{fit();selected=null;document.getElementById('search').value='';document.getElementById('kind').value='';document.getElementById('neighbors').checked=false;document.getElementById('details').replaceChildren(element('h2','点击节点查看来源与关系'));filter()};
function motionLabel(){document.getElementById('motion').textContent=paused?'继续布局':'暂停布局'}document.getElementById('motion').onclick=()=>{paused=!paused;steps=0;motionLabel();requestFrame()};new ResizeObserver(resize).observe(wrap);filter();resize();motionLabel();requestFrame();
</script></body></html>
